<!-- =========================================================
     SEO / Social Metadata Template
     Replace PAGE_* values for each page before publishing
     ========================================================= -->

<!-- Primary SEO -->
<title>PAGE_TITLE</title>

<meta
  name="description"
  content="PAGE_DESCRIPTION"
>

<link
  rel="canonical"
  href="PAGE_CANONICAL_URL"
>


<!-- Open Graph -->
<meta property="og:type" content="website">

<meta
  property="og:site_name"
  content="Kevin Crandall Developer Hub"
>

<meta
  property="og:title"
  content="PAGE_TITLE"
>

<meta
  property="og:description"
  content="PAGE_DESCRIPTION"
>

<meta
  property="og:url"
  content="PAGE_CANONICAL_URL"
>

<meta
  property="og:image"
  content="https://kevincrandall.dev/assets/images/social-preview.jpg"
>

<meta
  property="og:image:width"
  content="1200"
>

<meta
  property="og:image:height"
  content="630"
>

<meta
  property="og:image:alt"
  content="Kevin Crandall Developer Hub"
>


<!-- Twitter / X -->
<meta
  name="twitter:card"
  content="summary_large_image"
>

<meta
  name="twitter:title"
  content="PAGE_TITLE"
>

<meta
  name="twitter:description"
  content="PAGE_DESCRIPTION"
>

<meta
  name="twitter:image"
  content="https://kevincrandall.dev/assets/images/social-preview.jpg"
>

<meta
  name="twitter:image:alt"
  content="Kevin Crandall Developer Hub"
>
